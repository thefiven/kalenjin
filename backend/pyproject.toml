[project]
name = "kalenjin"
version = "0.1.0"
description = "Kalenjin backend — Garmin ingestion, AI coaching, plan generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "garminconnect>=0.3.5",
    "pydantic-settings>=2.4",
]

[project.scripts]
kalenjin-sync = "kalenjin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalenjin"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "garminconnect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL instance (see docker-compose.yml)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ: activities are timestamped in Garmin's local time, deliberately naive — see
# db/models.py's `started_at` column.
# B008: FastAPI's `Depends(...)` in a parameter default is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug this rule targets.
ignore = ["DTZ", "B008"]
